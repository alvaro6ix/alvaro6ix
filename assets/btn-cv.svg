<svg xmlns="http://www.w3.org/2000/svg" width="320" height="84" viewBox="0 0 320 84">
<defs>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#0b1120"/></linearGradient>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".13"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="cl"><rect x="2" y="2" width="316" height="80" rx="18"/></clipPath>
</defs>
<style>
 .t{font:700 20px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#f8fafc}
 .s{font:500 13px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#94a3b8}
 .shine{animation:mv 3.5s ease-in-out infinite}
 @keyframes mv{0%{transform:translateX(-320px)}60%,100%{transform:translateX(320px)}}
 .pulse{animation:p 2.4s ease-in-out infinite;transform-origin:50px 42px}
 @keyframes p{0%,100%{opacity:.35}50%{opacity:.8}}
</style>
